name: smoak-bot
services:
  - name: bot
    type: web
    instance_types:
      - type: free
    regions:
      - fra
    scalings:
      min: 1
      max: 1
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    health_checks:
      - protocol: http
        port: 8000
        path: /health
    git:
      repository: github.com/ВАШ_НИК/smoak-bot
      branch: main
      builder: DOCKERFILE
      dockerfile: Dockerfile
    env:
      - key: GUILD_ID
        value: "1568607492991353053"
      - key: MEMBERS_INTENT
        value: "0"
      - key: PORT
        value: "8000"
