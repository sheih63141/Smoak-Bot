name: SmoakTeam bot

on:
  workflow_dispatch:          # кнопка «Run workflow»
  push:
    branches: [main]
  schedule:
    # раз в 5 часов: частые рестарты убивали живого бота и давали
    # «Приложение не ответило вовремя» при нажатии на кнопку
    - cron: "0 */5 * * *"

concurrency:
  # ВАЖНО: одна группа на весь бот. Иначе запускается несколько ботов сразу —
  # отсюда двойные ответы в тикетах и «session has been invalidated».
  group: smoakteam-bot
  cancel-in-progress: true   # новый запуск выкидывает старый: бот всегда один

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # максимум GitHub Actions — 6 часов
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ставлю зависимости
        run: pip install --no-cache-dir -r requirements.txt

      - name: Запускаю бота
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: "1568607492991353053"
          MEMBERS_INTENT: "0"
          # авто-AFK выключен: бот не слышит речь в войсе
        # 5 ч 56 мин — за 4 минуты до лимита GitHub бот корректно завершается,
        # следующий запуск из расписания подхватывает эстафету
        run: timeout 21400 python -u automod_bot.py || true
