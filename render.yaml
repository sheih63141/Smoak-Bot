services:
  - type: web
    name: smoak-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false          # вписать в панели Render, в файл не кладём
      - key: GUILD_ID
        value: "1568607492991353053"
      - key: MEMBERS_INTENT
        value: "0"
      - key: IDLE_MINUTES
        value: "15"
      - key: PORT
        value: "8000"
